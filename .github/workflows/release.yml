name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux deb AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.AppImage

  test-deb:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts
      - name: Install .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./artifacts/*.deb
      - name: Check desktop entry and icons
        run: |
          test -f /usr/share/applications/project-manager.desktop || { echo "::error::desktop entry missing"; ls /usr/share/applications; exit 1; }
          grep -E "^(Name|Icon|Exec|StartupWMClass)=" /usr/share/applications/project-manager.desktop
          find /usr/share/icons -iname "*project*" | head -20
      - name: Launch app and make sure it stays running
        run: |
          BIN=""
          for f in /opt/ProjectManager/*; do
            case "$f" in *chrome*|*.so*|*.sh|*.pak|*.bin|*.dat) continue;; esac
            if [ -f "$f" ] && [ -x "$f" ]; then BIN="$f"; break; fi
          done
          echo "Launching: $BIN"
          xvfb-run -a "$BIN" > app.log 2>&1 &
          PID=$!
          sleep 30
          if kill -0 "$PID" 2>/dev/null; then
            echo "App still running after 30s: OK"
          else
            wait "$PID"; echo "::error::App exited early (exit $?)"; cat app.log; exit 1
          fi
          if grep -q -E "FATAL|No usable sandbox" app.log; then
            echo "::error::Fatal error in output"; cat app.log; exit 1
          fi
          pkill -f "$BIN" || true
          echo "Smoke test passed."
      - name: Post diagnostics to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## test-deb diagnostics"
            echo '```'
            echo "--- desktop entry ---"
            ls /usr/share/applications | grep -i project
            cat /usr/share/applications/project-manager.desktop 2>&1
            echo "--- icons ---"
            find /usr/share/icons -iname "*project*" 2>/dev/null | head -20
            echo "--- app output (tail) ---"
            tail -80 app.log 2>/dev/null || echo "(no app.log)"
            echo '```'
          } > diag.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@diag.md || true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: dist/*.exe

  release:
    needs: [test-deb, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "مدیریت پروژه $TAG" \
              --notes "نسخه دسکتاپ برنامه مدیریت پروژه. فایل‌ها: ProjectManager-Setup (ویندوز .exe)، .deb (دبیان/اوبونتو)، .AppImage (لینوکس)."
          fi
